# See https://github.com/helm/chart-testing#configuration
chart-dirs: charts
check-version-increment: false
debug: false
remote: origin
target-branch: main
upgrade: true
validate-chart-schema: true
validate-maintainers: false
validate-yaml: true
# The dwpk manager holds its leader-election Lease in dwpk-system (hardcoded),
# so CI installs there instead of in a random namespace.
namespace: dwpk-system
release-label: app.kubernetes.io/instance
