# Artifact Hub repository metadata, pushed to GHCR as an OCI artifact by the
# release workflow. The release step pushes this file unconditionally, so it
# has to exist even before the repository is registered.
#
# repositoryID is issued by Artifact Hub when the repository is added there,
# and it is what proves ownership. Paste the real one in once helm-dwpk is
# registered - an invented value is worse than none, because it claims someone
# else's repository.
# repositoryID: ""
owners:
