apiVersion: dwpk.devops-ia.io/v1alpha1
kind: UserSpace
metadata:
  labels:
    app.kubernetes.io/name: dwpk
  name: bob
spec:
  owner: "bob@example.com"
  quota:
    cpu: "16"
    memory: 64Gi
    storage: 200Gi
    workspaces: 2
  # ClusterEgress allows this namespace to reach other in-cluster services,
  # for example a shared internal database or package registry. Grant it
  # deliberately: it widens the blast radius of anything running in the
  # user's workspace pods.
  networkPolicy: ClusterEgress
