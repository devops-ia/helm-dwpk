apiVersion: dwpk.devops-ia.io/v1alpha1
kind: Workspace
metadata:
  labels:
    app.kubernetes.io/name: dwpk
  name: training
  namespace: dwpk-bob
spec:
  imageRef:
    name: pytorch-cuda12
  # A GPU is an extended resource, so Kubernetes requires its request and limit
  # to be equal - one number, written on both sides. It counts against the
  # UserSpace's gpu quota under the platform's configured resource name
  # (PlatformConfig.spec.gpuResourceName, nvidia.com/gpu by default).
  resources:
    requests: { cpu: "8", memory: "32Gi", nvidia.com/gpu: "2" }
    limits: { cpu: "16", memory: "64Gi", nvidia.com/gpu: "2" }
  storage: 100Gi
  sshAuthorizedKeys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIi bob@workstation"
  running: true
  # Longer idle timeout than the default: a training run left paused
  # overnight shouldn't get reaped before the next login.
  idleTimeout: 12h
