apiVersion: dwpk.devops-ia.io/v1alpha1
kind: WorkspaceImage
metadata:
  labels:
    app.kubernetes.io/name: dwpk
  name: node-18-legacy
spec:
  displayName: "Node.js 18 (legacy)"
  description: "Node.js 18 LTS. Kept only for existing workspaces; new ones should use node-20."
  tags: ["node", "javascript"]
  maintainer: "platform@example.com"
  # Hides this entry from the catalog and refuses new workspaces from it.
  # Existing Workspace objects keep running: the controller tears nothing down
  # because of this flag.
  deprecated: true
  # Or schedule it instead of flipping the flag by hand. Until the date the
  # entry works normally and its card counts down; from the date it behaves
  # exactly as `deprecated: true` above.
  #
  #   deprecateAt: "2026-12-01T00:00:00Z"
  image: "ghcr.io/devops-ia/dwpk/node:18"
  imagePullPolicy: IfNotPresent
  shell: /bin/bash
  homePath: /home/dev
  runAsUser: 1000
