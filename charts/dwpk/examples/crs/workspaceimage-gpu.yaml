apiVersion: dwpk.devops-ia.io/v1alpha1
kind: WorkspaceImage
metadata:
  labels:
    app.kubernetes.io/name: dwpk
  name: pytorch-cuda12
spec:
  displayName: "PyTorch (CUDA 12)"
  description: "PyTorch 2.x with CUDA 12 for model training and notebooks."
  icon: "https://cdn.example.com/icons/pytorch.svg"
  tags: ["ml", "gpu", "python"]
  maintainer: "platform@example.com"
  deprecated: false
  image: "ghcr.io/devops-ia/dwpk/pytorch:2.4-cuda12"
  imagePullPolicy: IfNotPresent
  shell: /bin/bash
  homePath: /home/dev
  runAsUser: 1000
  # Pin this entry's workspaces to the GPU nodepool. The device itself is
  # reserved by the workspace, not here: whoever creates one asks for
  # `nvidia.com/gpu` on the form, bounded by their UserSpace's gpu quota.
  # nodeSelector and the toleration only keep non-GPU work off those nodes.
  placement:
    nodeSelector:
      workload: worker-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
