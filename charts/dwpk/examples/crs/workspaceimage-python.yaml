apiVersion: dwpk.devops-ia.io/v1alpha1
kind: WorkspaceImage
metadata:
  labels:
    app.kubernetes.io/name: dwpk
  name: python-3-12
spec:
  displayName: "Python 3.12"
  description: "Python 3.12 with poetry, ruff and the AWS CLI."
  icon: "https://cdn.example.com/icons/python.svg"
  tags: ["python", "backend"]
  maintainer: "platform@example.com"
  deprecated: false
  image: "ghcr.io/devops-ia/dwpk/python:3.12"
  imagePullPolicy: IfNotPresent
  shell: /bin/bash
  homePath: /home/dev
  runAsUser: 1000
  # A catalog entry no longer carries sizes or storage. The person creating a
  # workspace types the CPU, memory, GPU and volume they want, and their
  # UserSpace quota is what bounds it - a menu of named sizes was one more list
  # for an administrator to keep in step with what people actually asked for.
  placement:
    nodeSelector: { workload: worker }
    tolerations: []
