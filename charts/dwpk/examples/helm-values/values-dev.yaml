# Example values for a local development cluster (kind, OrbStack, minikube).
# Use with:
#   helm install dwpk dist/chart -n dwpk-system --create-namespace -f examples/helm-values/values-dev.yaml
#
# Assumes you already created the OAuth client secret:
#   kubectl create secret generic dwpk-oauth -n dwpk-system \
#     --from-literal=github-client-secret=<your-github-client-secret>

manager:
  replicas: 1

gateway:
  enabled: true
  replicas: 1
  # LoadBalancer usually has no provisioner on a local cluster; NodePort is
  # reachable without one.
  service:
    type: NodePort
    port: 22

ui:
  enabled: true
  replicas: 1
  gatewayHost: localhost
  baseURL: "http://localhost:8080"
  # A local cluster rarely has a real TLS cert in front of it.
  cookieSecure: false
  ingress:
    enabled: false
  oauth:
    existingSecret: dwpk-oauth
    gitHub:
      clientID: "Iv1.local-dev-client-id"
      redirectURL: "http://localhost:8080/auth/github/callback"
      clientSecretKey: github-client-secret

# cert-manager is still needed locally: the webhook and metrics endpoint
# both get their TLS certs from it.
certManager:
  enabled: true

prometheus:
  enabled: false

networkPolicy:
  enabled: false
