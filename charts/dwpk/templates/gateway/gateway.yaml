{{- if or (not (hasKey .Values.gateway "enabled")) (.Values.gateway.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: gateway
    {{- with .Values.gateway.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "gateway" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.gateway.annotations }}
  annotations:
    {{- toYaml .Values.gateway.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dwpk.name" . }}
      control-plane: gateway
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: gateway
        {{- with .Values.gateway.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "dwpk.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: gateway
        {{- with .Values.gateway.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.gateway.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with (include "dwpk.imagePullSecrets" (dict "pullSecrets" .Values.gateway.imagePullSecrets "context" $)) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.gateway.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.gateway.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.initContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
      - args:
        - --listen-address={{ .Values.gateway.listenAddress }}
        - --host-key-path={{ .Values.gateway.hostKey.path }}
        {{- with .Values.gateway.extraArgs }}
        {{- range . }}
        - {{ . }}
        {{- end }}
        {{- end }}
        command:
        {{- with .Values.gateway.command }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - /gateway
        {{- end }}
        image: {{ include "dwpk.image" (dict "image" .Values.gateway.image "context" $) | quote }}
        {{- with .Values.gateway.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        {{- $sshProbe := dict "tcpSocket" (dict "port" "ssh") }}
        {{- with (include "dwpk.probe" (dict "probe" .Values.gateway.livenessProbe "custom" .Values.gateway.livenessProbeCustom "handler" $sshProbe)) }}
        livenessProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with (include "dwpk.probe" (dict "probe" .Values.gateway.startupProbe "custom" .Values.gateway.startupProbeCustom "handler" $sshProbe)) }}
        startupProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with .Values.gateway.lifecycle }}
        lifecycle:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with (include "dwpk.env" (dict "component" .Values.gateway)) }}
        env:
          {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.gateway.envFromFiles }}
        envFrom:
          {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        name: gateway
        ports:
        - containerPort: {{ include "dwpk.listenPort" .Values.gateway.listenAddress }}
          name: ssh
          protocol: TCP
        {{- with (include "dwpk.probe" (dict "probe" .Values.gateway.readinessProbe "custom" .Values.gateway.readinessProbeCustom "handler" $sshProbe)) }}
        readinessProbe:
          {{- . | nindent 10 }}
        {{- end }}
        resources:
          {{- if .Values.gateway.resources }}
          {{- toYaml .Values.gateway.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.gateway.securityContext }}
          {{- toYaml .Values.gateway.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
        - mountPath: {{ dir .Values.gateway.hostKey.path }}
          name: host-key
          readOnly: true
      securityContext:
        {{- if .Values.gateway.podSecurityContext }}
        {{- toYaml .Values.gateway.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "dwpk.gatewayServiceAccountName" . }}
      {{- if and (hasKey .Values.gateway "terminationGracePeriodSeconds") (ne .Values.gateway.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
      - name: host-key
        secret:
          items:
          - key: {{ .Values.gateway.hostKey.secretKey | quote }}
            path: {{ base .Values.gateway.hostKey.path | quote }}
          secretName: {{ .Values.gateway.hostKey.existingSecret | default (include "dwpk.resourceName" (dict "suffix" "gateway-hostkey" "context" $)) }}
{{- end }}
