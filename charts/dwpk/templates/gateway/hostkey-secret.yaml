{{- if or (not (hasKey .Values.gateway "enabled")) (.Values.gateway.enabled) }}
{{- if not .Values.gateway.hostKey.existingSecret }}
{{/*
lookup finds the Secret a previous release already created, so an upgrade
reuses the same key instead of rotating it - a rotated host key is exactly the
"Remote host key has changed" warning this exists to prevent, just moved from
every pod restart to every helm upgrade instead. resource-policy: keep also
survives a helm uninstall, for the same reason.
*/}}
{{- $secretName := include "dwpk.resourceName" (dict "suffix" "gateway-hostkey" "context" $) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.gateway.hostKey.secretKey }}: {{ if $existing }}{{ index $existing.data .Values.gateway.hostKey.secretKey }}{{ else }}{{ genPrivateKey "ed25519" | b64enc }}{{ end }}
{{- end }}
{{- end }}
