{{- if or (not (hasKey .Values.adminBootstrap "enabled")) (.Values.adminBootstrap.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "admin-bootstrap" "context" $) }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Runs before the manager Deployment so an admin token exists as soon as
    # the release is usable; re-runs on every upgrade but AdminToken is
    # idempotent, so a second run is a no-op (§7.7).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dwpk.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "dwpk.adminBootstrapServiceAccountName" . }}
      containers:
      - name: admin-bootstrap
        image: "{{ .Values.manager.image.repository }}{{- if not (contains "@" .Values.manager.image.repository) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        command:
        - /manager
        args:
        - --bootstrap-admin-token
        - --bootstrap-namespace={{ .Release.Namespace }}
        - --bootstrap-service-account={{ include "dwpk.adminSessionServiceAccountName" . }}
        env:
        - name: DWPK__ADMIN_USERNAME
          value: {{ .Values.adminBootstrap.username | default "admin" | quote }}
        - name: DWPK__ADMIN_EMAIL
          value: {{ .Values.adminBootstrap.email | default "admin@dwpk.local" | quote }}
        - name: DWPK__ADMIN_USERSPACE
          value: {{ include "dwpk.adminUserSpaceName" . | quote }}
        {{- if .Values.adminBootstrap.password.existingSecret }}
        - name: DWPK__ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adminBootstrap.password.existingSecret | quote }}
              key: {{ .Values.adminBootstrap.password.existingSecretKey | default "password" | quote }}
        {{- else if .Values.adminBootstrap.password.value }}
        - name: DWPK__ADMIN_PASSWORD
          value: {{ .Values.adminBootstrap.password.value | quote }}
        {{- end }}
        resources:
          {{- if .Values.adminBootstrap.resources }}
          {{- toYaml .Values.adminBootstrap.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
