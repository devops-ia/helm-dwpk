{{- if or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled) }}
{{- if not .Values.manager.gitSSHEncryptionKey.existingSecret }}
{{/*
lookup finds the Secret a previous release already created, so an upgrade
reuses the same key instead of rotating it - a rotated key would leave every
already-encrypted dwpk-git-ssh-keys Secret undecryptable, exactly the outcome
resource-policy: keep and this lookup exist to prevent (mirrors
templates/gateway/hostkey-secret.yaml's reasoning for the same pattern).

The name is a fixed literal, not run through dwpk.resourceName the way most
of this chart's resources are: the operator's Go code
(api/v1alpha1/enums.go's GitSSHEncryptionKeySecretName) addresses this Secret
by that exact name, with no way to pass it a release-specific one.
*/}}
{{- $secretName := "dwpk-git-ssh-encryption-key" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # AES-256, 32 random bytes - randBytes already returns them base64-encoded.
  key: {{ if $existing }}{{ index $existing.data "key" }}{{ else }}{{ randBytes 32 }}{{ end }}
{{- end }}
{{- end }}
