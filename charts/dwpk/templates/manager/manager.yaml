{{- if or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dwpk.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "dwpk.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with (include "dwpk.imagePullSecrets" (dict "pullSecrets" .Values.manager.imagePullSecrets "context" $)) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.manager.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.manager.dnsConfig }}
      dnsConfig: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.initContainers }}
      initContainers: {{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:8081
        {{- if .Values.rbac.helpers.enabled }}
        - --admin-cluster-roles={{ include "dwpk.adminClusterRoles" . }}
        {{- end }}
        {{- if or (not (hasKey .Values.gateway "enabled")) (.Values.gateway.enabled) }}
        {{- /*
          Point the controller at the gateway Service so it can publish the
          LoadBalancer address in Workspace status.endpoint. Users reach the
          gateway over a VPN, which cannot resolve a cluster-internal DNS name.
          The controller falls back to --gateway-host when the Service has no
          address, so this is safe for ClusterIP installs too.
        */}}
        - --gateway-service={{ .Release.Namespace }}/{{ include "dwpk.resourceName" (dict "suffix" "gateway-service" "context" $) }}
        {{- end }}
        {{- with .Values.manager.gatewayHost }}
        - --gateway-host={{ . }}
        {{- end }}
        {{- /*
          The git-ssh-keys encryption key (see templates/manager/git-ssh-encryption-key-secret.yaml)
          lives in this release's own namespace, not any user's - the manager
          already runs there, so this is the release namespace itself rather
          than a separate value to keep in sync.
        */}}
        - --git-ssh-encryption-key-namespace={{ .Release.Namespace }}
        {{- range .Values.manager.args }}
        - {{ . }}
        {{- end }}
        {{- if .Values.certManager.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        command:
        {{- with .Values.manager.command }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - /manager
        {{- end }}
        image: {{ include "dwpk.image" (dict "image" .Values.manager.image "context" $) | quote }}
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        {{- $healthz := dict "httpGet" (dict "path" "/healthz" "port" 8081) }}
        {{- $readyz := dict "httpGet" (dict "path" "/readyz" "port" 8081) }}
        {{- with (include "dwpk.probe" (dict "probe" .Values.manager.livenessProbe "custom" .Values.manager.livenessProbeCustom "handler" $healthz)) }}
        livenessProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with (include "dwpk.probe" (dict "probe" .Values.manager.startupProbe "custom" .Values.manager.startupProbeCustom "handler" $healthz)) }}
        startupProbe:
          {{- . | nindent 10 }}
        {{- end }}
        {{- with .Values.manager.lifecycle }}
        lifecycle:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with (include "dwpk.env" (dict "component" .Values.manager)) }}
        env:
          {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.manager.envFromFiles }}
        envFrom:
          {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        {{- with (include "dwpk.probe" (dict "probe" .Values.manager.readinessProbe "custom" .Values.manager.readinessProbeCustom "handler" $readyz)) }}
        readinessProbe:
          {{- . | nindent 10 }}
        {{- end }}
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
          {{- if .Values.manager.extraVolumeMounts }}
          {{- toYaml .Values.manager.extraVolumeMounts | nindent 10 }}
          {{- end }}
          {{- if .Values.certManager.enabled }}
          - mountPath: /tmp/k8s-webhook-server/serving-certs
            name: webhook-certs
            readOnly: true
          {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "dwpk.serviceAccountName" . }}
      {{- if and (hasKey .Values.manager "terminationGracePeriodSeconds") (ne .Values.manager.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
        {{- if .Values.manager.extraVolumes }}
        {{- toYaml .Values.manager.extraVolumes | nindent 8 }}
        {{- end }}
        {{- if .Values.certManager.enabled }}
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
        {{- end }}
{{- end }}
