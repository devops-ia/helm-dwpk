{{- if or (not (hasKey .Values.adminBootstrap "enabled")) (.Values.adminBootstrap.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    {{- with .Values.adminBootstrap.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "dwpk.adminBootstrapServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
