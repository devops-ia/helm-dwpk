{{- if or (not (hasKey .Values.adminBootstrap "enabled")) (.Values.adminBootstrap.enabled) }}
{{/*
UserSpace is cluster-scoped, so the bootstrap Job needs a ClusterRole to create
the admin one. Scoped to UserSpaces alone: the Job can never touch a RoleBinding. It does not
grant privileges directly - it sets role: administrator on the UserSpace it
creates, and the controller turns that into ClusterRoleBindings.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  name: {{ include "dwpk.resourceName" (dict "suffix" "admin-bootstrap-userspace" "context" $) }}
rules:
- apiGroups:
  - dwpk.devops-ia.io
  resources:
  - userspaces
  verbs:
  - get
  - list
  - create
  # delete is what the UserSpace admission webhook tests to decide whether a
  # requester may grant the administrator role. The bootstrap creates the
  # platform's first administrator, so it has to pass that test.
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  name: {{ include "dwpk.resourceName" (dict "suffix" "admin-bootstrap-userspace" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dwpk.resourceName" (dict "suffix" "admin-bootstrap-userspace" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "dwpk.adminBootstrapServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
