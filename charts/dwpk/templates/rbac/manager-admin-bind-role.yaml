{{- if and .Values.rbac.helpers.enabled (not .Values.rbac.namespaced) }}
{{/*
Lets the controller bind the admin ClusterRoles to a UserSpace whose role is
"administrator".

RBAC escalation prevention refuses a binding that grants rights the creator does
not itself hold, and the manager deliberately does not hold cluster admin. The
`bind` verb is the documented exception: holding it on an exact resourceName
permits creating bindings to that role and nothing else. This is the same
mechanism the manager already uses for the built-in `edit` role.

Scoped by name on purpose. A blanket `bind` on clusterroles would let the
controller grant anything in the cluster.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "manager-admin-bind" "context" $) }}
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  {{- range (splitList "," (include "dwpk.adminClusterRoles" .)) }}
  - {{ . }}
  {{- end }}
  verbs:
  - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "manager-admin-bind" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dwpk.resourceName" (dict "suffix" "manager-admin-bind" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "dwpk.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
