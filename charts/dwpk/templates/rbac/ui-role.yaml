{{- if or (not (hasKey .Values.ui "enabled")) (.Values.ui.enabled) }}
{{- if .Values.rbac.namespaced }}
{{- fail "ui requires cluster-scoped RBAC; set rbac.namespaced=false" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dwpk.resourceName" (dict "suffix" "ui-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resourceNames:
  - session
  # A read-scoped API token mints for this second account, so the UI has to be
  # able to request a token for it too. Named explicitly rather than left open:
  # this grant is "mint for these two accounts", not "mint for anything".
  - session-readonly
  resources:
  - serviceaccounts/token
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectaccessreviews
  verbs:
  - create
- apiGroups:
  - dwpk.devops-ia.io
  resources:
  - userspaces
  verbs:
  - get
  - list
  - watch
# The platform's own name and logo. The login page renders both before anyone
# has signed in, so there is no user token to read them with. Read-only, one
# cluster-scoped object, and it grants nothing over anybody's workspaces.
- apiGroups:
  - dwpk.devops-ia.io
  resources:
  - platformconfigs
  verbs:
  - get
  - list
  - watch
{{- end }}
