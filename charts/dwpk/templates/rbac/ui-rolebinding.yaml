{{- if or (not (hasKey .Values.ui "enabled")) (.Values.ui.enabled) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "ui-rolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dwpk.resourceName" (dict "suffix" "ui-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "dwpk.uiServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
