{{- if or (not (hasKey .Values.ui "enabled")) (.Values.ui.enabled) }}
{{- $tokenNamespace := .Values.ui.tokenNamespace | default .Release.Namespace }}
{{/*
Namespaced on purpose: the UI reads and writes API token Secrets only in the
one namespace they live in, so a compromised UI cannot read Secrets anywhere
else in the cluster.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "ui-tokens-role" "context" $) }}
  namespace: {{ $tokenNamespace }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "dwpk.resourceName" (dict "suffix" "ui-tokens-rolebinding" "context" $) }}
  namespace: {{ $tokenNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dwpk.resourceName" (dict "suffix" "ui-tokens-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "dwpk.uiServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
