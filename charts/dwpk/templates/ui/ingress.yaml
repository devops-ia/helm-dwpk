{{- if and (or (not (hasKey .Values.ui "enabled")) (.Values.ui.enabled)) .Values.ui.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dwpk.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: ui
  name: {{ include "dwpk.resourceName" (dict "suffix" "ui-ingress" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ui.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ui.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.ui.ingress.hosts }}
  - {{- with .host }}
    host: {{ . | quote }}
    {{- end }}
    http:
      paths:
      {{- range .paths }}
      - backend:
          service:
            name: {{ include "dwpk.resourceName" (dict "suffix" "ui-service" "context" $) }}
            port:
              number: {{ $.Values.ui.service.port }}
        path: {{ .path | quote }}
        pathType: {{ .pathType }}
      {{- end }}
  {{- end }}
{{- end }}
