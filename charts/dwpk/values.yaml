# -- Settings shared by every component
global:
  # -- Registry prefixed to every image repository, for a mirror or an
  # air-gapped install. Empty pulls each image from where its own
  # `repository` points.
  imageRegistry: ""
  # -- Pull secrets applied to every component, merged with each component's own
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  # - name: myregistrykey

# -- String to partially override chart.fullname template (will maintain the release name)
nameOverride: ""

# -- String to fully override chart.fullname template
fullnameOverride: ""

# -- Configure the controller manager deployment
manager:
  # -- Set to false to skip manager installation
  enabled: true

  # -- Number of manager replicas. Leader election means the extras are warm
  # spares rather than added throughput: one replica reconciles, and a standby
  # takes the lease when it dies. Pair with `manager.podDisruptionBudget` so a
  # drain cannot evict both before the handover.
  replicas: 2

  image:
    # -- Image repository
    repository: ghcr.io/devops-ia/dwpk
    # -- Image tag (defaults to Chart.appVersion if not set)
    # tag: ""
    pullPolicy: IfNotPresent

  # -- Arguments
  args:
    - --leader-elect

  # -- SSH hostname published in Workspace `status.endpoint` as
  # `<workspace>@<host>`. Only used as a fallback: when the gateway Service has
  # a LoadBalancer address, that address is published instead. Leave empty to
  # keep the controller's own default.
  gatewayHost: ""

  # -- The AES-256 key that encrypts every user's self-service git-ssh-keys
  # Secret at rest. The manager decrypts with it on reconcile; the UI
  # encrypts with it on upload (see templates/rbac/ui-git-ssh-key-role.yaml).
  gitSSHEncryptionKey:
    # -- Set true when a Secret literally named dwpk-git-ssh-encryption-key
    # (data key `key`, 32 random bytes) already exists and this chart should
    # not manage it. Unlike gateway.hostKey.existingSecret this is not a name
    # to point at a different Secret - the operator's Go code addresses this
    # one by a fixed name, with no flag to override it. Leave false and the
    # chart generates it itself on first install (kept across upgrades, for
    # the same reason gateway.hostKey is: a rotated key would leave every
    # already-uploaded git-ssh key undecryptable).
    existingSecret: false

  # -- Image pull secrets, merged with `global.imagePullSecrets`
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  # - name: myregistrykey

  # -- Pod-level security settings
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security settings
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  # -- Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Manager pod's affinity
  affinity: {}

  # -- Manager pod's node selector
  nodeSelector: {}

  # -- Manager pod's tolerations
  tolerations: []

  # -- Deployment strategy
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

  # -- Priority class name
  # </br> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
  priorityClassName: ""

  # -- Topology spread constraints
  # </br> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule

  # -- Override the container command. Empty keeps the image's own entrypoint,
  # which is what you want unless you are debugging.
  command: []
  # - /manager

  # -- Extra environment variables, as a plain map. Names are upper-cased. A
  # name also present in `envFromSecrets` or `envFromConfigMap` is ignored
  # here: those take precedence.
  env: {}
  # MY_VARIABLE: my-value

  # -- Environment variables read from existing Secrets
  # </br> Ref: https://kubernetes.io/docs/concepts/configuration/secret/
  envFromSecrets: {}
  # MY_VARIABLE:
  #   name: my-secret
  #   key: secret_key

  # -- Environment variables read from existing ConfigMaps
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
  envFromConfigMap: {}
  # MY_VARIABLE:
  #   name: my-configmap
  #   key: key

  # -- Load every key of a ConfigMap or Secret as environment variables
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#configure-all-key-value-pairs-in-a-configmap-as-container-environment-variables
  envFromFiles: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret

  # -- Additional init containers
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  initContainers: []
  # - name: wait
  #   image: busybox:1.36
  #   command: ['sh', '-c', 'sleep 5']

  # -- Additional volumeMounts on the manager container
  extraVolumeMounts: []
  # - name: extra-volume
  #   mountPath: /extra

  # -- Additional volumes on the manager pod
  extraVolumes: []
  # - name: extra-volume
  #   emptyDir: {}

  # -- Container lifecycle hooks
  # </br> Ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
  lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 5"]

  # -- Liveness probe timings. Checks `/healthz` on the probe port.
  # The check itself is fixed, because which endpoint reports health is a
  # property of the binary rather than a deployment choice. Replace the whole
  # probe with `livenessProbeCustom`.
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  # -- Replace the liveness probe entirely. When set it wins over `livenessProbe`.
  livenessProbeCustom: {}

  # -- Readiness probe timings. Checks `/readyz` on the probe port.
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  # -- Replace the readiness probe entirely
  readinessProbeCustom: {}

  # -- Startup probe timings. Off by default: the manager starts fast enough that the liveness probe's initial delay covers it.
  startupProbe:
    enabled: false
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 30

  # -- Replace the startup probe entirely
  startupProbeCustom: {}

  # -- Disruption budget. Leader election makes the extra replicas warm spares, and this is what stops a node drain evicting all of them before a standby holds the lease.
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: 1

  # -- Pod DNS policy. Empty leaves the cluster default.
  # </br> Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
  dnsPolicy: ""

  # -- Pod DNS configuration
  dnsConfig: {}
  # options:
  #   - name: ndots
  #     value: "1"

  # -- Termination grace period seconds
  terminationGracePeriodSeconds: 10

  # -- Custom Deployment labels
  labels: {}

  # -- Custom Deployment annotations
  annotations: {}

  # -- Custom Pod labels and annotations
  pod:
    labels: {}
    annotations: {}

# -- Configure the SSH gateway deployment
gateway:
  # -- Set to false to skip gateway installation
  enabled: true

  replicas: 2

  image:
    # -- Image repository
    repository: ghcr.io/devops-ia/dwpk-gateway
    # -- Image tag (defaults to Chart.appVersion if not set)
    # tag: ""
    pullPolicy: IfNotPresent

  # -- Extra arguments appended after --listen-address and --host-key-path
  extraArgs: []

  # -- Address passed to the gateway --listen-address flag
  listenAddress: ":2222"

  # -- SSH host key configuration. Every replica and every restart mounts the
  # same key from a Secret - VS Code Remote-SSH and other clients that pin a
  # host key refuse to connect the moment two connections to the same address
  # see two different ones.
  hostKey:
    # -- Path passed to the gateway --host-key-path flag
    path: /var/run/dwpk-gateway/hostkey/hostkey.pem
    # -- Existing Secret containing the private key file. Leave empty and the
    # chart generates one itself on first install (kept across upgrades, so it
    # is not regenerated and re-trusted every release).
    existingSecret: ""
    # -- Secret key containing the PEM-encoded private key
    secretKey: hostkey.pem

  # -- Image pull secrets, merged with `global.imagePullSecrets`
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  # - name: myregistrykey

  # -- Pod-level security settings
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security settings
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  # -- Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Gateway pod's affinity
  affinity: {}

  # -- Gateway pod's node selector
  nodeSelector: {}

  # -- Gateway pod's tolerations
  tolerations: []

  # -- Deployment strategy
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

  # -- Priority class name
  # </br> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
  priorityClassName: ""

  # -- Topology spread constraints
  # </br> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule

  # -- Override the container command. Empty keeps the image's own entrypoint,
  # which is what you want unless you are debugging.
  command: []
  # - /gateway

  # -- Extra environment variables, as a plain map. Names are upper-cased. A
  # name also present in `envFromSecrets` or `envFromConfigMap` is ignored
  # here: those take precedence.
  env: {}
  # MY_VARIABLE: my-value

  # -- Environment variables read from existing Secrets
  # </br> Ref: https://kubernetes.io/docs/concepts/configuration/secret/
  envFromSecrets: {}
  # MY_VARIABLE:
  #   name: my-secret
  #   key: secret_key

  # -- Environment variables read from existing ConfigMaps
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
  envFromConfigMap: {}
  # MY_VARIABLE:
  #   name: my-configmap
  #   key: key

  # -- Load every key of a ConfigMap or Secret as environment variables
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#configure-all-key-value-pairs-in-a-configmap-as-container-environment-variables
  envFromFiles: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret

  # -- Additional init containers
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  initContainers: []
  # - name: wait
  #   image: busybox:1.36
  #   command: ['sh', '-c', 'sleep 5']

  # -- Container lifecycle hooks
  # </br> Ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
  lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 5"]

  # -- Liveness probe timings. Opens a TCP connection to the SSH port.
  # The check itself is fixed, because which endpoint reports health is a
  # property of the binary rather than a deployment choice. Replace the whole
  # probe with `livenessProbeCustom`.
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  # -- Replace the liveness probe entirely. When set it wins over `livenessProbe`.
  livenessProbeCustom: {}

  # -- Readiness probe timings. Opens a TCP connection to the SSH port.
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  # -- Replace the readiness probe entirely
  readinessProbeCustom: {}

  # -- Startup probe timings. Off by default: the gateway binds its listener immediately.
  startupProbe:
    enabled: false
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 30

  # -- Replace the startup probe entirely
  startupProbeCustom: {}

  # -- Disruption budget. The gateway carries live SSH sessions, so keeping a replica through a drain is the difference between a reconnect and a dropped shell.
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: 1

  # -- Pod DNS policy. Empty leaves the cluster default.
  # </br> Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
  dnsPolicy: ""

  # -- Pod DNS configuration
  dnsConfig: {}
  # options:
  #   - name: ndots
  #     value: "1"

  # -- Termination grace period seconds
  terminationGracePeriodSeconds: 10

  # -- Custom Deployment labels
  labels: {}

  # -- Custom Deployment annotations
  annotations: {}

  # -- Custom Pod labels and annotations
  pod:
    labels: {}
    annotations: {}

  # -- ServiceAccount configuration
  serviceAccount:
    # -- Set to false to reuse an existing ServiceAccount
    create: true
    # -- Existing ServiceAccount name (used when create=false)
    name: ""
    # -- Custom ServiceAccount annotations
    # annotations: {}
    # -- Custom ServiceAccount labels
    # labels: {}

  # -- Gateway Service configuration
  service:
    type: LoadBalancer
    port: 22
    # -- Service annotations, for example to request an internal load balancer
    annotations: {}
    # -- Custom Service labels
    labels: {}

# -- Configure the UI deployment
ui:
  # -- Set to false to skip UI installation
  enabled: true

  replicas: 1

  image:
    # -- Image repository
    repository: ghcr.io/devops-ia/dwpk-ui
    # -- Image tag (defaults to Chart.appVersion if not set)
    # tag: ""
    pullPolicy: IfNotPresent

  # -- Listen address passed through DWPK__UI_LISTEN_ADDRESS
  listenAddress: ":8080"

  # -- Optional DWPK__UI_KUBECONFIG override. Leave empty for in-cluster config.
  kubeconfig: ""

  # -- Public gateway host shown in generated SSH commands
  gatewayHost: dwpk.example.com

  # -- Public base URL used to derive default OAuth callback URLs
  baseURL: ""

  # -- Session TTL passed through DWPK__UI_SESSION_TTL
  sessionTTL: 15m

  # -- Cookie Secure flag passed through DWPK__UI_COOKIE_SECURE
  cookieSecure: true

  # -- Log level passed through DWPK__UI_LOG_LEVEL (debug, info, warn, error)
  logLevel: info

  # -- Optional path prefix if the UI is served behind a reverse proxy under
  # a non-root path (e.g. "/dwpk"). Passed through DWPK__UI_BASE_PATH. The
  # proxy must forward the full prefixed path unmodified (no rewrite).
  basePath: ""

  # -- Namespace holding the API token Secrets the REST API issues and looks
  # up. Passed through DWPK__UI_TOKEN_NAMESPACE. Defaults to the release
  # namespace, and the UI's Secrets access is scoped to this namespace alone.
  tokenNamespace: ""

  # -- Local username/password login, for demos and environments without an
  # OAuth2 provider. Local users are stored as Kubernetes Secrets (§7.8).
  localAuth:
    enabled: true
    # -- Namespace local-user credential Secrets are stored in. Defaults to
    # the release namespace when unset.
    namespace: ""

  # -- Image pull secrets, merged with `global.imagePullSecrets`
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  # - name: myregistrykey

  # -- Pod-level security settings
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security settings
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  # -- Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- UI pod's affinity
  affinity: {}

  # -- UI pod's node selector
  nodeSelector: {}

  # -- UI pod's tolerations
  tolerations: []

  # -- Deployment strategy
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

  # -- Priority class name
  # </br> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
  priorityClassName: ""

  # -- Topology spread constraints
  # </br> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule

  # -- Override the container command. Empty keeps the image's own entrypoint,
  # which is what you want unless you are debugging.
  command: []
  # - /ui

  # -- Extra environment variables, as a plain map. Names are upper-cased. A
  # name also present in `envFromSecrets` or `envFromConfigMap` is ignored
  # here: those take precedence.
  env: {}
  # MY_VARIABLE: my-value

  # -- Environment variables read from existing Secrets
  # </br> Ref: https://kubernetes.io/docs/concepts/configuration/secret/
  envFromSecrets: {}
  # MY_VARIABLE:
  #   name: my-secret
  #   key: secret_key

  # -- Environment variables read from existing ConfigMaps
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
  envFromConfigMap: {}
  # MY_VARIABLE:
  #   name: my-configmap
  #   key: key

  # -- Load every key of a ConfigMap or Secret as environment variables
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#configure-all-key-value-pairs-in-a-configmap-as-container-environment-variables
  envFromFiles: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret

  # -- Additional init containers
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  initContainers: []
  # - name: wait
  #   image: busybox:1.36
  #   command: ['sh', '-c', 'sleep 5']

  # -- Container lifecycle hooks
  # </br> Ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
  lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 5"]

  # -- Liveness probe timings. Requests `/login`, which needs no session.
  # The check itself is fixed, because which endpoint reports health is a
  # property of the binary rather than a deployment choice. Replace the whole
  # probe with `livenessProbeCustom`.
  # </br> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  # -- Replace the liveness probe entirely. When set it wins over `livenessProbe`.
  livenessProbeCustom: {}

  # -- Readiness probe timings. Requests `/login`, which needs no session.
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  # -- Replace the readiness probe entirely
  readinessProbeCustom: {}

  # -- Startup probe timings. Off by default. Turn it on if the UI's first Kubernetes call is slow on a cold cluster.
  startupProbe:
    enabled: false
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 30

  # -- Replace the startup probe entirely
  startupProbeCustom: {}

  # -- Disruption budget. Keeps the UI reachable through a node drain.
  # </br> Ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: 1

  # -- Pod DNS policy. Empty leaves the cluster default.
  # </br> Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
  dnsPolicy: ""

  # -- Pod DNS configuration
  dnsConfig: {}
  # options:
  #   - name: ndots
  #     value: "1"

  # -- Termination grace period seconds
  terminationGracePeriodSeconds: 10

  # -- Custom Deployment labels
  labels: {}

  # -- Custom Deployment annotations
  annotations: {}

  # -- Custom Pod labels and annotations
  pod:
    labels: {}
    annotations: {}

  # -- ServiceAccount configuration
  serviceAccount:
    # -- Set to false to reuse an existing ServiceAccount
    create: true
    # -- Existing ServiceAccount name (used when create=false)
    name: ""
    # -- Custom ServiceAccount annotations
    # annotations: {}
    # -- Custom ServiceAccount labels
    # labels: {}

  # -- UI Service configuration
  service:
    type: ClusterIP
    port: 80
    # -- Service annotations
    annotations: {}
    # -- Custom Service labels
    labels: {}

  # -- Optional Ingress for the UI Service
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
    - host: ui.example.com
      paths:
      - path: /
        pathType: Prefix
    tls: []

  # -- Optional Kubernetes Gateway API (https://kubernetes.io/docs/concepts/services-networking/gateway/)
  # route for the UI Service, as an alternative to ui.ingress. Mutually
  # independent of ingress: enable one or the other (or neither).
  gateway:
    enabled: false
    # -- Create a Gateway object for this release. Set to false to attach to
    # an existing Gateway via gateway.parentRefs instead.
    create: true
    # -- Required when gateway.create is true.
    className: ""
    # -- Listeners for the Gateway this chart creates. Only used when
    # gateway.create is true. See the Gateway API Listener spec.
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # -- HTTPRoute annotations
    annotations: {}
    # -- HTTPRoute parentRefs, used instead of gateway.create's own Gateway
    # when gateway.create is false (attach to an existing Gateway).
    parentRefs: []
    # -- HTTPRoute hostnames
    hostnames: []
    # -- HTTPRoute rules. backendRefs to the UI Service are added
    # automatically; set matches/filters per rule as needed.
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /

  # -- OAuth provider configuration
  oauth:
    # -- Existing Secret containing provider client secrets
    existingSecret: ""
    # -- Entra ID provider configuration (maps to DWPK__UI_PROVIDER_ENTRA_ID_*)
    entraID:
      clientID: ""
      issuerURL: ""
      redirectURL: ""
      clientSecretKey: entra-id-client-secret
      # -- Group object IDs granted the admin role on login, regardless of
      # their UserSpace's own spec.role. Requires GroupMembershipClaims
      # enabled on the app registration. See docs/INSTALLATION.md.
      adminGroups: []
      # -- Group object IDs granted the user role on login (only checked
      # when none of adminGroups match).
      userGroups: []
    # -- Google provider configuration (maps to DWPK__UI_PROVIDER_GOOGLE_*)
    google:
      clientID: ""
      issuerURL: ""
      redirectURL: ""
      clientSecretKey: google-client-secret
      # -- Group identifiers granted the admin role on login. See
      # docs/INSTALLATION.md for group-claim mapping.
      adminGroups: []
      # -- Group identifiers granted the user role on login.
      userGroups: []
    # -- GitLab provider configuration (maps to DWPK__UI_PROVIDER_GITLAB_*)
    gitLab:
      clientID: ""
      issuerURL: ""
      redirectURL: ""
      clientSecretKey: gitlab-client-secret
      # -- Group paths/IDs granted the admin role on login.
      adminGroups: []
      # -- Group paths/IDs granted the user role on login.
      userGroups: []
    # -- Keycloak provider configuration (maps to DWPK__UI_PROVIDER_KEYCLOAK_*)
    keycloak:
      clientID: ""
      issuerURL: ""
      redirectURL: ""
      clientSecretKey: keycloak-client-secret
      # -- Realm group names granted the admin role on login.
      adminGroups: []
      # -- Realm group names granted the user role on login.
      userGroups: []
    # -- GitHub provider configuration (maps to DWPK__UI_PROVIDER_GITHUB_*).
    # GitHub has no group claim, so it has no adminGroups/userGroups option.
    gitHub:
      clientID: ""
      redirectURL: ""
      clientSecretKey: github-client-secret

# -- RBAC configuration
rbac:
  # -- RBAC resource scope
  # - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  # - true: Role/RoleBinding (release namespace only)
  namespaced: false

  # -- Helper roles for CRD management (admin/editor/viewer)
  helpers:
    # -- Install convenience admin/editor/viewer roles for CRDs. Defaults to
    # true because adminBootstrap (below) binds the local admin token to
    # these ClusterRoles; set both to false together if you don't want
    # either.
    enabled: true

# -- Local admin API token bootstrap (§7.7). A Helm pre-install/pre-upgrade
# hook Job issues a one-time admin token if none exists yet, so the platform
# is usable before any OAuth2 provider is configured. Requires
# rbac.helpers.enabled=true and rbac.namespaced=false.
adminBootstrap:
  # -- Set to false to skip local admin token bootstrap entirely
  enabled: true

  # -- Username for the bootstrapped admin login
  username: admin

  # -- Owner identity for the admin. Must be unique across UserSpaces: login
  # resolves an identity to exactly one UserSpace by this value.
  email: admin@dwpk.local

  # -- Name of the UserSpace created for the admin. Its namespace is
  # dwpk-<name>, and it is provisioned with quota.workspaces=0 so no pod can
  # ever run as the identity that holds cluster-wide admin.
  userSpaceName: admin

  # -- Admin password. Leave both keys empty to have one generated on first
  # install and written once to the dwpk-admin-bootstrap Secret.
  password:
    # -- Literal password. Prefer existingSecret; a literal here lands in the
    # Helm release stored in the cluster.
    value: ""
    # -- Name of an existing Secret holding the password
    existingSecret: ""
    # -- Key within existingSecret
    existingSecretKey: password

  serviceAccount:
    # -- Extra annotations for the admin bootstrap ServiceAccount
    annotations: {}

  # -- Resources for the bootstrap Job's pod
  resources: {}

# -- ServiceAccount configuration
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  # -- Existing ServiceAccount name (only when enabled=false)
  # Note: When enabled=true, respects nameOverride/fullnameOverride
  # name: ""

  # -- Custom ServiceAccount annotations
  # annotations: {}

  # -- Custom ServiceAccount labels
  # labels: {}

# -- Custom Resource Definitions
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

# -- Controller metrics endpoint.
# Enable to expose /metrics endpoint
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

# -- Cert-manager integration for TLS certificates.
# Required for webhook certificates and metrics endpoint certificates.
certManager:
  enabled: true

# -- Webhook server configuration
webhook:
  enabled: true
  # Webhook server port
  port: 9443

# -- Prometheus ServiceMonitor for metrics scraping.
# Requires prometheus-operator to be installed in the cluster.
prometheus:
  enabled: false

# -- Network policies for controlling traffic flow.
# Enable to restrict ingress to the controller manager.
networkPolicy:
  enabled: false
